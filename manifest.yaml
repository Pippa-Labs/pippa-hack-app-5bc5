# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
#
# Replace everything below with your own app. The example describes a small
# "days until" app so you can see the shape of each part.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# EMPTY ON PURPOSE. Claude asks you for it before anything else, and nothing
# publishes until it is filled in (the build says "Nothing to publish yet").
#
# It is the name everybody sees next to your app: "by <name>" on the install
# screen, in the list of apps and on every answer your app gives. So it is
# PUBLIC, and it should be a pseudonym: a made-up name or a nickname, never
# your real name and never an email address. This repository is public too,
# so anyone can read it here as well.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "Mau2k3"

app:
  id: hack.app_5bc5
  name: Gene Day
  version: 0.1.0
  summary: >-
    Works out your latest coffee time and the lactose in a food, from a plain
    DNA trait you state such as slow caffeine metaboliser or lactose
    intolerant. Never receives raw DNA, genotypes or health risks, and keeps
    nothing.

agent_types:
  - personal

outcomes:
  - id: caffeine.cutoff
    summary: Work out the latest time to drink coffee from caffeine metabolism speed and bedtime
    example_phrases:
      - when is my last coffee
      - latest time i can have coffee
      - coffee cutoff time for a slow caffeine metaboliser
      - can i still drink coffee at
      - when should i stop drinking caffeine
      - last espresso before bed
      - caffeine curfew
    inputs:
      - name: caffeine_metabolism
        type: string
        required: false
        description: >-
          How fast the user says their body breaks down caffeine, as one word:
          "slow", "normal" or "fast" (a slow or fast caffeine metaboliser, for
          example from their CYP1A2 gene result). Use what the user has told
          you about themselves. If it is not known, return an empty string
          rather than guessing. Never put DNA letters or rs numbers here.
      - name: bedtime
        type: string
        required: false
        description: >-
          The time the user plans to go to sleep, as 24 hour HH:MM, for
          example "23:00" or "22:30". If the message does not say, return an
          empty string rather than guessing.
    output:
      - name: last_coffee_time
        type: string
        description: Latest clock time for caffeine, as HH:MM.
      - name: hours_before_bed
        type: integer
        description: How many hours before bedtime caffeine should stop.
      - name: metabolism_used
        type: string
        description: The metabolism speed the answer is based on.
      - name: bedtime_used
        type: string
        description: The bedtime the answer is based on, as HH:MM.

  - id: lactose.check
    summary: Estimate the grams of lactose in a food and whether a lactose intolerant person usually copes with it
    example_phrases:
      - how much lactose is in
      - is a latte ok if i am lactose intolerant
      - can i eat this with lactose intolerance
      - grams of lactose in
      - is this dish safe for my lactose
      - does cheese have lactose
    inputs:
      - name: food
        type: string
        required: false
        description: >-
          The food or drink the user asks about, in their words, for example
          "latte", "pizza" or "ice cream". If the message names none, return
          an empty string rather than guessing.
      - name: lactose_status
        type: string
        required: false
        description: >-
          Whether the user has said they are "tolerant" or "intolerant" to
          lactose (for example from their lactase gene result). If they have
          not said, return an empty string rather than guessing. Never put DNA
          letters or rs numbers here.
    output:
      - name: food_matched
        type: string
        description: The food from the table the answer is based on.
      - name: serving
        type: string
        description: The typical serving the figure is for.
      - name: lactose_grams
        type: number
        description: Approximate grams of lactose in that serving.
      - name: verdict
        type: string
        description: One of "fine", "usually ok", "likely symptoms".
      - name: likely_ok
        type: boolean
        description: True when most people with this status cope with one serving.
